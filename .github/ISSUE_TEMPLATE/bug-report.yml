name: Bug Report
description: Report unexpected or incorrect behavior in the SDK.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        **Never include real bearer tokens, API keys, passwords, hostnames, or
        other live credentials/customer data** in this report — see
        [SECURITY.md](../../SECURITY.md). Redact anything sensitive from
        logs before pasting them below.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is the bug? What did you try to do?
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: What actually happened instead?
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Reproduction steps
      description: Minimal steps (or code) to reproduce the issue.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: input
    id: sdk-version
    attributes:
      label: SDK version
      description: "e.g. from `pip show logrhythm-python-sdk` or `logrhythm_sdk.__version__`"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      description: "e.g. from `python --version`"
    validations:
      required: true

  - type: input
    id: operating-system
    attributes:
      label: Operating system
      description: e.g. Windows 11, Ubuntu 24.04, macOS 15
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >-
        Relevant, redacted log output. Never paste real tokens, credentials,
        hostnames, or customer data — see the notice above.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: secrets-confirmation
    attributes:
      label: Secret confirmation
      options:
        - label: >-
            I have confirmed this report contains no real credentials,
            tokens, hostnames, or customer data.
          required: true
