[project]
name = "logrhythm-python-sdk"
version = "0.1.0"
description = "A typed Python SDK for the LogRhythm SIEM REST APIs"
readme = "README.md"
requires-python = ">=3.13"
# No license has been chosen for this project yet; intentionally omitted rather
# than guessed. See README.md.
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.9,<3",
    "httpx>=0.27,<1",
    "pyyaml>=6.0,<7",
]

[dependency-groups]
dev = [
    "ruff>=0.12",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pre-commit>=4.6",
    "conventional-pre-commit>=4.2,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/logrhythm_sdk"]

# ----------------------------------------------------------------------------
# Ruff
# ----------------------------------------------------------------------------

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # Ruff-specific rules
    "D",    # pydocstyle
    "PT",   # flake8-pytest-style
    "BLE",  # flake8-blind-except
    "TRY",  # tryceratops (exception handling hygiene)
    "ANN",  # flake8-annotations
    "N",    # pep8-naming
    "C4",   # flake8-comprehensions
]
ignore = [
    "D203",   # one-blank-line-before-class (conflicts with D211)
    "D213",   # multi-line-summary-second-line (conflicts with D212)
    "ANN401", # dynamically typed Any is sometimes legitimate
    "TRY003", # long messages inside exception classes are fine
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "D100", # missing docstring in public module
    "D101", # missing docstring in public class
    "D102", # missing docstring in public method
    "D103", # missing docstring in public function
    "D104", # missing docstring in public package
    "ANN201", # missing return type annotation for public function
]

# ----------------------------------------------------------------------------
# mypy
# ----------------------------------------------------------------------------

[tool.mypy]
python_version = "3.13"
files = ["src/logrhythm_sdk"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_unreachable = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
show_error_codes = true
pretty = true

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true
warn_required_dynamic_aliases = true

# ----------------------------------------------------------------------------
# pytest / coverage
# ----------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--verbose",
    "--cov=src/logrhythm_sdk",
    "--cov-report=term-missing",
]

[tool.coverage.run]
source = ["src/logrhythm_sdk"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
